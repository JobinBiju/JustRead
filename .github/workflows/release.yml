# Builds signed release APKs and publishes them as a GitHub release.
#
# Release by pushing a version tag:
#   git tag v1.2.3 && git push origin v1.2.3
#
# The tag sets the app version: versionName 1.2.3, versionCode 10203 (major·10000 + minor·100 + patch).
#
# Needs these repository secrets (Settings › Secrets and variables › Actions):
#   JUSTREAD_KEYSTORE_BASE64    the release keystore, base64-encoded
#   JUSTREAD_KEYSTORE_PASSWORD  its password
#   JUSTREAD_KEY_ALIAS          the key's alias
#   JUSTREAD_KEY_PASSWORD       the key's password
# Every release must be signed with the same key, or it won't install over the one before.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (versionCode $CODE)"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JUSTREAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::JUSTREAD_KEYSTORE_BASE64 is not set: refusing to publish a debug-signed release"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "JUSTREAD_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          JUSTREAD_KEYSTORE_PASSWORD: ${{ secrets.JUSTREAD_KEYSTORE_PASSWORD }}
          JUSTREAD_KEY_ALIAS: ${{ secrets.JUSTREAD_KEY_ALIAS }}
          JUSTREAD_KEY_PASSWORD: ${{ secrets.JUSTREAD_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Check signatures
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            certs=$("$APKSIGNER" verify --print-certs "$apk")  # fails the step if the signature is bad
            echo "$apk: $certs"
            if grep -q "CN=Android Debug" <<< "$certs"; then
              echo "::error::$apk is debug-signed"; exit 1
            fi
          done

      - name: Collect APKs
        run: |
          mkdir -p out
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            abi="${apk##*/app-}"; abi="${abi%-release.apk}"
            cp "$apk" "out/JustRead-${{ steps.version.outputs.name }}-$abi.apk"
          done
          (cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: JustRead ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: out/*
          body: |
            ### Which APK?

            | File | For |
            |---|---|
            | `JustRead-${{ steps.version.outputs.name }}-arm64-v8a.apk` | Almost all current phones |
            | `JustRead-${{ steps.version.outputs.name }}-armeabi-v7a.apk` | Older 32-bit phones |
            | `JustRead-${{ steps.version.outputs.name }}-x86_64.apk` | Emulators and Intel/AMD devices |
            | `JustRead-${{ steps.version.outputs.name }}-x86.apk` | Old 32-bit emulators |
            | `JustRead-${{ steps.version.outputs.name }}-universal.apk` | Any device, if you're unsure |

            Requires Android 8.0 or newer. `SHA256SUMS.txt` lists each file's checksum.
